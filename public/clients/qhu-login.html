<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QHU — Acceso</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --noche: #0F1633; --indigo: #4338F0; --linea: #2A3466; --tinta-3: #8E95AD;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--sans); background: var(--noche); color: #fff;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .box { text-align: center; max-width: 360px; width: 100%; }
  .marca { font-size: 30px; font-weight: 800; letter-spacing: 0.2em; }
  .rule { width: 48px; height: 2px; background: var(--indigo); margin: 26px auto; }
  p.msg { font-size: 14px; color: #B9BEDC; margin-bottom: 22px; }
  input { width: 100%; padding: 13px 16px; font-family: var(--sans); font-size: 15px; text-align: center;
    letter-spacing: 0.1em; border: 1px solid var(--linea); background: rgba(255,255,255,.05); color: #fff; outline: none; }
  input::placeholder { color: #6F779C; }
  input:focus { border-color: var(--indigo); }
  button { width: 100%; margin-top: 12px; padding: 13px 16px; cursor: pointer; font-family: var(--sans);
    font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
    background: var(--indigo); color: #fff; border: none; transition: opacity .2s; }
  button:hover { opacity: .88; }
  .error { display: none; font-size: 13px; color: #FF8A8A; margin-top: 14px; }
  .error.show { display: block; }
</style>
</head>
<body>
<div class="box">
  <div class="marca">QHU</div>
  <div class="rule"></div>
  <p class="msg">Este espacio es privado. Ingres&aacute; la clave para continuar.</p>
  <form id="f">
    <input type="password" id="pass" placeholder="Clave de acceso" autocomplete="off" autofocus>
    <button type="submit">Entrar</button>
  </form>
  <p class="error" id="err">Clave incorrecta. Prob&aacute; de nuevo.</p>
</div>
<script>
(function () {
  var COOKIE = 'client_auth_qhu';
  if (document.cookie.indexOf(COOKIE + '=') !== -1) {
    document.getElementById('err').classList.add('show');
    document.cookie = COOKIE + '=; path=/; max-age=0';
  }
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('pass').value.trim();
    if (!v) return;
    document.cookie = COOKIE + '=' + encodeURIComponent(v) + '; path=/; max-age=2592000; SameSite=Lax';
    location.reload();
  });
})();
</script>
</body>
</html>
