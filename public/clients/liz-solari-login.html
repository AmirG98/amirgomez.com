<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lis Solari · Acceso</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #FBFAF7; --fg: #000; --muted: #55607A; --line: #E7E3D9; --accent: #C4A265; --btn: #000;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .brand { font-size: 15px; font-weight: 500; letter-spacing: 0.34em; text-transform: uppercase; }
  .brand span { color: var(--accent); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--sans); background: var(--bg); color: var(--fg);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .box { text-align: center; max-width: 360px; width: 100%; }
  .rule { width: 48px; height: 2px; background: var(--accent); margin: 26px auto; }
  p.msg { font-size: 14px; color: var(--muted); margin-bottom: 22px; }
  input { width: 100%; padding: 13px 16px; font-family: var(--sans); font-size: 15px; text-align: center;
    letter-spacing: 0.1em; border: 1px solid var(--line); background: #fff; color: var(--fg); outline: none; }
  input:focus { border-color: var(--accent); }
  button { width: 100%; margin-top: 12px; padding: 13px 16px; cursor: pointer; font-family: var(--sans);
    font-size: 12px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
    background: var(--btn); color: #fff; border: none; transition: opacity .2s; }
  button:hover { opacity: .88; }
  .error { display: none; font-size: 13px; color: #a33; margin-top: 14px; }
  .error.show { display: block; }
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-icon.png">
</head>
<body>
<div class="box">
  <div class="brand">DOMIC<span>&nbsp;·&nbsp;</span>EXPERIENCES</div>
  <div class="rule"></div>
  <p class="msg">Este panel es privado. Ingresá tu clave de acceso para continuar.</p>
  <form id="f">
    <input type="password" id="pass" placeholder="Clave de acceso" autocomplete="off" autofocus>
    <button type="submit">Entrar</button>
  </form>
  <p class="error" id="err">Clave incorrecta. Probá de nuevo.</p>
</div>
<script>
(function () {
  var COOKIE = 'client_auth_liz-solari';
  if (document.cookie.indexOf(COOKIE + '=') !== -1) {
    document.getElementById('err').classList.add('show');
    document.cookie = COOKIE + '=; path=/; max-age=0';
  }
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('pass').value.trim();
    if (!v) return;
    document.cookie = COOKIE + '=' + encodeURIComponent(v) + '; path=/; max-age=2592000; SameSite=Lax';
    location.reload();
  });
})();
</script>
</body>
</html>
