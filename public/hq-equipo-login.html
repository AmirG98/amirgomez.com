<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A+Growth · Tablero del equipo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #101214; --panel: #17191d; --ink: #f1f2f3; --ink-2: #a2a8ad; --ink-3: #6b7176; --line: rgba(255,255,255,0.10); --orange: #f97316; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .box { text-align: center; max-width: 360px; width: 100%; }
  .wordmark { font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.01em; color: #fff; }
  .wordmark span { color: var(--orange); }
  .hq { display: inline-block; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.3em; color: var(--orange); border: 1px solid var(--orange); border-radius: 6px; padding: 3px 10px 3px 13px; margin-top: 10px; }
  .rule { width: 48px; height: 2px; background: var(--orange); margin: 26px auto; }
  p.msg { font-size: 14px; color: var(--ink-2); margin-bottom: 22px; }
  input { width: 100%; padding: 13px 16px; font-family: 'Inter', sans-serif; font-size: 15px; text-align: center; letter-spacing: 0.1em; border: 1px solid var(--line); background: var(--panel); color: var(--ink); outline: none; border-radius: 8px; }
  input:focus { border-color: var(--orange); }
  input::placeholder { color: var(--ink-3); }
  button { width: 100%; margin-top: 12px; padding: 13px 16px; cursor: pointer; border-radius: 8px; font-family: 'Archivo', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; background: var(--orange); color: #101214; border: none; }
  button:hover { background: #fb8b3c; }
  .error { display: none; font-size: 13px; color: #ff8a80; margin-top: 14px; }
  .error.show { display: block; }
</style>
</head>
<body>
<div class="box">
  <div class="wordmark">A<span>+</span>GROWTH</div>
  <div class="hq">EQUIPO</div>
  <div class="rule"></div>
  <p class="msg">Tablero de tareas del equipo. Ingresá la clave que compartimos.</p>
  <form id="f">
    <input type="password" id="pass" placeholder="Clave del equipo" autocomplete="off" autofocus>
    <button type="submit">Entrar</button>
  </form>
  <p class="error" id="err">Clave incorrecta.</p>
</div>
<script>
(function () {
  var COOKIE = 'agrowth_team';
  if (document.cookie.indexOf(COOKIE + '=') !== -1) {
    document.getElementById('err').classList.add('show');
    document.cookie = COOKIE + '=; path=/; max-age=0';
  }
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('pass').value.trim();
    if (!v) return;
    document.cookie = COOKIE + '=' + encodeURIComponent(v) + '; path=/; max-age=2592000; SameSite=Lax';
    location.reload();
  });
})();
</script>
</body>
</html>
